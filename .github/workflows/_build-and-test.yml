name: Build and test the nanobind distribution

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash -l {0}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: build
          channels: conda-forge
          auto-activate-base: false
          python-version: ${{ matrix.python }}
      - name: Install build and test dependencies
        run: |
          conda install -y --file requirements/conda.txt
          python -m pip install build pytest pytest-cov
      - name: Build sdist and then wheel from the sdist
        run: |
          # Check the revision before the sdist discards Git metadata.
          cmake -DLIBDIFFPY_SOURCE_DIR="$PWD/extern/libdiffpy" -P cmake/LibdiffpyVersion.cmake
          python -m build
      - name: Bundle Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          python -m pip install auditwheel patchelf
          LD_LIBRARY_PATH="$CONDA_PREFIX/lib" auditwheel repair dist/*.whl -w wheelhouse
      - name: Bundle macOS runtime libraries
        if: runner.os == 'macOS'
        run: |
          python -m pip install delocate
          delocate-wheel -w wheelhouse dist/*.whl
      - uses: actions/checkout@v6
        with:
          repository: diffpy/pyobjcryst
          # Integration against the current migration, not an orphanable SHA.
          # Switch to a release tag when the nanobind migration is released.
          ref: nanobind_migration_test
          submodules: recursive
          path: .integration/pyobjcryst
      - name: Record the pyobjcryst integration revision
        run: |
          revision=$(git -C .integration/pyobjcryst rev-parse HEAD)
          echo "pyobjcryst nanobind_migration_test: $revision"
          {
            echo "### pyobjcryst integration source"
            echo "The migration branch is a moving integration dependency."
            echo "Resolved commit: https://github.com/diffpy/pyobjcryst/commit/$revision"
            git -C .integration/pyobjcryst submodule status --recursive
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install pyobjcryst migration and the built wheel
        run: |
          python -m pip install ./.integration/pyobjcryst
          python -m pip install wheelhouse/*.whl
          python -c "import pyobjcryst._pyobjcryst"
      - name: Test installed wheel and ObjCryst integration
        run: python -m pytest tests --cov=diffpy.srreal --cov-report=xml
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python }}
          path: wheelhouse/*.whl
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.14'
        with:
          name: sdist
          path: dist/*.tar.gz
