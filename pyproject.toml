[build-system]
requires = [
    "scikit-build-core>=0.10",
    "setuptools-scm>=8",
    "nanobind>=3.1,<4",
]
build-backend = "scikit_build_core.build"

[project]
name = "diffpy.srreal"
dynamic = ["version"]
dependencies = ["numpy"]
authors = [
  {name='Simon Billinge', email='sbillinge@ucsb.edu'},
]
maintainers = [
  {name='Simon Billinge', email='sbillinge@ucsb.edu'},
]
description = "Calculators for PDF, bond valence sum, and other quantities based on atom pair interaction."
keywords = ['PDF', 'BVS', 'atom', 'overlap', 'calculator', 'real-space']
readme = "README.rst"
requires-python = ">=3.12, <3.15"
classifiers = [
        'Development Status :: 5 - Production/Stable',
        'Environment :: Console',
        'Intended Audience :: Developers',
        'Intended Audience :: Science/Research',
        'License :: OSI Approved :: BSD License',
        'Operating System :: MacOS :: MacOS X',
        'Operating System :: Microsoft :: Windows',
        'Operating System :: POSIX',
        'Operating System :: Unix',
        'Programming Language :: Python :: 3.12',
        'Programming Language :: Python :: 3.13',
        'Programming Language :: Python :: 3.14',
        'Topic :: Scientific/Engineering :: Physics',
        'Topic :: Scientific/Engineering :: Chemistry',
]

[project.urls]
Homepage = "https://github.com/diffpy/diffpy.srreal/"
Issues = "https://github.com/diffpy/diffpy.srreal/issues/"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.build-type = "Release"
wheel.packages = ["src/diffpy"]
sdist.cmake = true
sdist.include = [
    "_build/libdiffpy-version.hpp",
    "extern/libdiffpy/src/diffpy/**",
    "extern/libdiffpy/src/runtime/**",
    "extern/libdiffpy/LICENSE.rst",
    "extern/libdiffpy/LICENSE_DANSE.rst",
]
sdist.exclude = [".agents", ".codex", "cache", "build", "dist"]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

# PyPI wheels: Boost.Serialization and GSL are linked statically, so the
# wheels install into any environment without conda or system libraries.
# vcpkg.json pins the library versions; tools/install-vcpkg-deps.* install
# them once per platform in before-all (see the overrides below).
[tool.cibuildwheel]
build = ["cp312-*", "cp313-*", "cp314-*"]
skip = ["*-musllinux_*"]
test-extras = ["test"]
test-command = "pytest {project}/tests"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
config-settings = { "cmake.define.SRREAL_STATIC_DEPS" = "ON", "cmake.define.SRREAL_DEPS_LICENSE_DIR" = "/opt/srreal-deps/licenses", "cmake.define.CMAKE_TOOLCHAIN_FILE" = "/opt/srreal-deps/vcpkg/scripts/buildsystems/vcpkg.cmake", "cmake.define.VCPKG_INSTALLED_DIR" = "/opt/srreal-deps/installed", "cmake.define.VCPKG_MANIFEST_INSTALL" = "OFF" }

[tool.cibuildwheel.macos]
archs = ["native"]
# Keep in sync with VCPKG_OSX_DEPLOYMENT_TARGET in tools/vcpkg-triplets.
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
config-settings = { "cmake.define.SRREAL_STATIC_DEPS" = "ON", "cmake.define.SRREAL_DEPS_LICENSE_DIR" = "/tmp/srreal-deps/licenses", "cmake.define.CMAKE_TOOLCHAIN_FILE" = "/tmp/srreal-deps/vcpkg/scripts/buildsystems/vcpkg.cmake", "cmake.define.VCPKG_INSTALLED_DIR" = "/tmp/srreal-deps/installed", "cmake.define.VCPKG_MANIFEST_INSTALL" = "OFF" }

# No Windows ARM64 wheels.
[tool.cibuildwheel.windows]
archs = ["AMD64"]
before-all = "powershell -NoProfile -ExecutionPolicy Bypass -File {project}/tools/install-vcpkg-deps.ps1 C:/srreal-deps srreal-x64-windows"
config-settings = { "cmake.define.SRREAL_STATIC_DEPS" = "ON", "cmake.define.SRREAL_DEPS_LICENSE_DIR" = "C:/srreal-deps/licenses", "cmake.define.CMAKE_TOOLCHAIN_FILE" = "C:/srreal-deps/vcpkg/scripts/buildsystems/vcpkg.cmake", "cmake.define.VCPKG_INSTALLED_DIR" = "C:/srreal-deps/installed", "cmake.define.VCPKG_MANIFEST_INSTALL" = "OFF", "cmake.define.VCPKG_TARGET_TRIPLET" = "srreal-x64-windows" }
before-build = "pip install delvewheel"
# Other diffpy distributions also install diffpy/__init__.py. Keep the DLL
# loader in diffpy.srreal and use the runtime matching the build toolset.
repair-wheel-command = "delvewheel repair --namespace-pkg diffpy --add-path C:/srreal-deps/redist -w {dest_dir} {wheel}"

# One vcpkg triplet per architecture; see tools/vcpkg-triplets.
[[tool.cibuildwheel.overrides]]
select = "*-manylinux_x86_64"
inherit.config-settings = "append"
before-all = "bash {project}/tools/install-vcpkg-deps.sh /opt/srreal-deps srreal-x64-linux"
config-settings = { "cmake.define.VCPKG_TARGET_TRIPLET" = "srreal-x64-linux" }

[[tool.cibuildwheel.overrides]]
select = "*-macosx_x86_64"
inherit.config-settings = "append"
before-all = "bash {project}/tools/install-vcpkg-deps.sh /tmp/srreal-deps srreal-x64-osx"
config-settings = { "cmake.define.VCPKG_TARGET_TRIPLET" = "srreal-x64-osx" }

[[tool.cibuildwheel.overrides]]
select = "*-macosx_arm64"
inherit.config-settings = "append"
before-all = "bash {project}/tools/install-vcpkg-deps.sh /tmp/srreal-deps srreal-arm64-osx"
config-settings = { "cmake.define.VCPKG_TARGET_TRIPLET" = "srreal-arm64-osx" }

[tool.setuptools_scm]
version_scheme = "no-guess-dev"

[project.optional-dependencies]
test = ["pytest", "diffpy.structure", "periodictable"]

[tool.codespell]
exclude-file = ".codespell/ignore_lines.txt"
ignore-words = ".codespell/ignore_words.txt"
skip = "*.cif,*.dat"

[tool.docformatter]
recursive = true
wrap-summaries = 72
wrap-descriptions = 72

[tool.black]
line-length = 79
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | \.rst
  | \.txt
  | _build
  | buck-out
  | build
  | dist

  # The following are specific to Black, you probably don't want those.
  | blib2to3
  | tests/data
)/
'''
